name: Rapport
options:
  bundleIdPrefix: com.rapport
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad (universal)
    ENABLE_PREVIEWS: YES

targets:
  Rapport:
    type: application
    platform: iOS
    sources:
      - path: Rapport
    resources:
      - path: Rapport/Resources
    info:
      path: Rapport/App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Rapport
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true # self-hosted backend often reached via a plain-HTTP LAN address
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rapport.ios
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - RapportTests
        - RapportUITests
      gatherCoverageData: true

  RapportTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RapportTests
    dependencies:
      - target: Rapport
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rapport.ios.tests

  RapportUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RapportUITests
    dependencies:
      - target: Rapport
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rapport.ios.uitests
        TEST_TARGET_NAME: Rapport

schemes:
  Rapport:
    build:
      targets:
        Rapport: all
    test:
      targets:
        - RapportTests
        - RapportUITests
    run:
      config: Debug
