name: Rapport
options:
  bundleIdPrefix: com.rapport
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Free Apple ID personal-team signing (egulinsky@googlemail.com) already
    # trusted on this Mac — enables on-device installs (real iPad/iPhone,
    # not just the simulator) without a paid Developer Program membership.
    # Personal-team builds expire after ~7 days; CI reinstalling on every
    # push naturally keeps this refreshed.
    DEVELOPMENT_TEAM: "WGUH67BL77"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad (universal)
    ENABLE_PREVIEWS: YES

targets:
  Rapport:
    type: application
    platform: iOS
    sources:
      - path: Rapport
    resources:
      - path: Rapport/Resources
    info:
      path: Rapport/App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Rapport
        # Without these, xcodegen writes its own literal "1.0"/"1" defaults
        # into Info.plist on every `xcodegen generate` (including in CI,
        # which regenerates before every build) — silently overwriting
        # MARKETING_VERSION/CURRENT_PROJECT_VERSION below and making version
        # bumps a no-op. Pointing at the build settings as variables makes
        # them the actual source of truth again.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true # self-hosted backend often reached via a plain-HTTP LAN address
        # Required for ServerDiscovery.swift's local-network subnet scan
        # (used during onboarding to auto-find the backend) — iOS shows a
        # one-time permission prompt with this text before allowing any
        # connection to a private/LAN IP address.
        NSLocalNetworkUsageDescription: "Rapport scans your local network to find your self-hosted Rapport server automatically."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rapport.ios
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - RapportTests
        - RapportUITests
      gatherCoverageData: true

  RapportTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RapportTests
    dependencies:
      - target: Rapport
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rapport.ios.tests

  RapportUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RapportUITests
    dependencies:
      - target: Rapport
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rapport.ios.uitests
        TEST_TARGET_NAME: Rapport

schemes:
  Rapport:
    build:
      targets:
        Rapport: all
    test:
      targets:
        - RapportTests
        - RapportUITests
    run:
      config: Debug
